<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base/colors.css">
    <link rel="stylesheet" href="css/base/fonts.css">
    <link rel="stylesheet" href="css/pages/aluno.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <title>Opaco - Login</title>
</head>

<body>
    <div class="login-content">
        <img src="assets/images/opaco_logo.svg" alt="Opaco Logo" class="login-logo">
        <form action="#" class="login-form">
            <div class="form-header">
                <h2 class="form-title">Bem vindo de volta!</h2>
                <p class="form-subtitle">Faça login na sua conta</p>
            </div>

            <div class="input-group">
                <label class="login-label" for="username">Username</label>
                <div class="input-field">
                    <span class="icon"><img src="assets/icons/face-icon.svg" alt=""></span>
                    <input type="username" id="username" class="login-input" placeholder="Insira seu nome de usuário">
                </div>
            </div>

            <div class="input-group">
                <label for="password" class = "login-label">Senha</label>
                <div class="input-field">
                    <span class="icon"><img src="assets/icons/password-icon.svg" alt=""></span>
                    <input type="password" id="password" class="login-input" placeholder="Insira sua senha">
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox">
                    <span class="checkmark"></span>
                    Lembrar de mim
                </label>
                <a href="#" class="link-forgot">Esqueceu a senha?</a>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-login" id="form">Fazer login</button>
                <p>Não tem uma conta ainda? <a href="signup.html" class="link-highlight">Registrar-se</a></p>
            </div>
            <a href="#" class="admin-login">
                <span class="icon"><img src="assets/icons/admin-icon.svg" alt=""></span> <span>Fazer login como administrador</span>
            </a>
        </form>
    </div>
    <div class="login-decorator">

    </div>

    <script src="js/core/utils.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
