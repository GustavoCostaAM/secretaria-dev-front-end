<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/fonts.css">

    <title>Opaco — Login</title>
</head>

<body style="overflow-y: hidden;">
    <div class="form-wrap">
        <div>
            <h2>Bem vindo de volta!</h2>
            <p>Faça login na sua conta</p>
        </div>
        <form action="#">
            <div class="input-container">
                <p class="bold">E-mail</p>
                <div>
                    <img class="icon" src="/assets/icons/face-icon.svg">
                    <input type="username" name="email" placeholder="Insira seu nome de usuário" pattern="" required>
                </div>
            </div>

            <div class="input-container">
                <p class="bold">Senha</p>
                <div>
                    <img class="icon" src="/assets/icons/password-icon.svg">
                    <input type="password" name="password" placeholder="Insira sua senha" pattern="" required>
                </div>
            </div>

            <div class="login-actions">
                <div class="remind-me">
                    <input type="checkbox">
                    <p>Lembrar de mim</p>
                </div>
                <a href="#">Esqueceu a senha?</a>
            </div>

            <div>
                <button type="submit">Fazer login</button>
            </div>
        </form>

        <p>Não tem uma conta ainda? <a href="#">Registrar-se</a></p>
    </div>

    <a id="admin-redirect" href="#">
        <img class="icon" src="/assets/icons/admin-icon.svg">
        <span>Fazer login como administrador</span>
    </a>

    <div>
    </div>
</body>

</html>
