<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <title>Opaco - Login</title>
</head>

<body>
    <div class="login-content">
        <img src="/assets/opaco_logo.svg" alt="Opaco Logo" class="login-logo">
        <form action="#" class="login-form">
            <div class="form-header">
                <h2 class="form-title">Bem vindo de volta!</h2>
                <p class="form-subtitle">Faça login na sua conta</p>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-field">
                    <span class="icon">😊</span>
                    <input type="email" id="email" class="login-input" placeholder="Insira seu e-mail">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <div class="input-field">
                    <span class="icon">😊</span>
                    <input type="password" id="password" class="login-input" placeholder="Insira sua senha">
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox"> Lembrar de mim
                </label>
                <a href="#" class="link-forgot">Esqueceu a senha?</a>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-login">Fazer login</button>
                <p>Não tem uma conta ainda? <a href="#" class="link-highlight">Registrar-se</a></p>
            </div>

            <a href="#" class="admin-login">
                <img src="" alt=""> <span>Fazer login como administrador</span>
            </a>
        </form>
    </div>
    <div class="login-decorator">

    </div>
</body>
</html>
