<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <main>
        <div id="card-login">
            <img src="/assets/imagens/Logo-SM.png" alt="logo">
            <forms>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Acessar</button>
            </forms>
        </div>
        <div id="recuperar-senha-email">
            <form action="" method="get">
                <h3>Recuperar senha</h3>
                <p>Insira o e-mail que está cadastrado e
                    acesse o link que será enviado no seu e-mail</p>
                <input type="email" name="rec-email" id="rec-senha-email">
                <button type="submit">Enviar</button>
                <button type="button">Cancelar</button>
            </form>
        </div>
    </main>
</body>

</html>
