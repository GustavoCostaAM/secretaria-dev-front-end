<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/crud.css">

    <title>Opaco - Área do Aluno</title>
</head>

<body>
    <div class="layout">
        <div>

        </div>
        <div id="major">
            <div>
                <img class="logo" src="../assets/opaco_logo.svg" alt="Logo da Opaco">
            </div>
            <hr>
            <main>
                <div class="content-box">
                    <h1>Olá, administrador!</h1>

                </div>
                <div class="content-box">
                    <div class="crud-header">
                        <h1>Usuários</h1>
                        <div id="search-div">
                            <button id="create-button" onclick="openDialog('create-register')">
                                <img src="../assets/icones/create.svg" alt="criar novo registro">
                            </button>
                            <form action="" method="">
                                <input type="search" id="search" placeholder="Buscar usuario">
                            </form>
                        </div>
                    </div>
                    <hr>
                    <br>
                    <div class="table-wrap">
                        <table class="table-boletim">
                            <thead class="table-header">
                                <th>Id</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Apelido</th>
                                <th>Role</th>
                                <th>Ações</th>
                            </thead>
                            <tbody id="table-infos">
                                <!--CRUD's loop for-->
                                <tr class="table-register">
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td>
                                    </td>
                                </tr>
                                <!--Meh-->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
        <aside>
            <img src="../assets/mini_logo.svg" class="minilogo" alt="Mini logo da Opaco" width="75px">
            <div>
                <a href="">
                    <button class="aside-button">
                        <img src="../assets/icons/home-icon.svg" alt="home_icon" width="35x">
                    </button>
                </a>
                <br>
                <br>
                <button class="aside-button" id="sair">
                    <img src="../assets/icones/fi-br-undo-alt.svg" alt="Sair" width="35px">
                </button>
            </div>
        </aside>
    </div>

    <dialog id="edit-register">
        <button class="close" onclick="closeDialog('edit-register')"><img
                src="../assets/icones/close-button.svg"></button>
        <h1>Editar Registro</h1>
        <form id="editUserForm">

            <input type="hidden" id="edit-user-id">
        
            <label for="name">Nome:</label>
            <input type="text" id="name">
        
            <label for="email">Email:</label>
            <input type="email" id="email">
        
            <label for="username">Username:</label>
            <input type="text" id="username">
        
            <button type="submit" class="button">
                Atualizar
            </button>
        
        </form>
    </dialog>

    <dialog id="create-register">
        <button class="close" onclick="closeDialog('create-register')"><img
                src="../assets/icones/close-button.svg"></button>
        <h1>Criar novo registro</h1>
        <form id="createUserForm">

            <!--Acho que não precisa desse mais né?-->
            <!-- <input type="hidden" id="create-user-id"> -->
        
            <label for="name">Nome:</label>
            <input type="text" id="name">
        
            <label for="email">Email:</label>
            <input type="email" id="email">
        
            <label for="username">Username:</label>
            <input type="text" id="username">

            <label for="">Role:</label>
            <select id="role">
                <option value="" disabled selected hidden>Tipo de usuario</option>
                <option value="professor">PROFESSOR</option>
                <option value="aluno">ALUNO</option>
                <option value="admin">ADMINISTRADOR</option>
            </select>
        
            <button type="submit" class="button">
                Criar
            </button>
        </form>
    </dialog>

    <script src="../js/util.js"></script>
    <script src="../js/crud-admin.js"></script>
    <script src="../js/popup.js"></script>
</body>

</html>
