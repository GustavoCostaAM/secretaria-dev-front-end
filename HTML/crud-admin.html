<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/crud.css">

    <title>Opaco - Area do Aluno</title>
</head>

<body>
    <div class="layout">
        <div>

        </div>
        <div id="major">
            <div>
                <img class="logo" src="../assets/opaco_logo.svg" alt="Logo da Opaco">
            </div>
            <hr>
            <main>
                <div class="content-box">
                    <h1>Olá, administrador!</h1>

                </div>
                <div class="content-box">
                    <div class="crud-header">
                        <h1>Usuários</h1>
                        <div id="search-div">
                            <form action="" method="">
                                <input type="search" id="search" placeholder="Buscar por Matéria">
                            </form>
                        </div>
                    </div>
                    <hr>
                    <br>
                    <div class="table-wrap">
                        <table class="table-boletim">
                            <thead class="table-header">
                                <th>Id</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Password</th>
                                <th>Role</th>
                                <th>Ações</th>
                            </thead>
                            <tbody id="table-infos">
                                <!--CRUD's loop for-->
                                <tr class="table-register">
                                    <td>123</td>
                                    <td>Artur de Oliveira</td>
                                    <td>a***@hotmail.com</td>
                                    <td>********</td>
                                    <td>STUDENT</td>
                                    <td>
                                        <button class="edit register" onclick="openDialog('edit-register')">
                                            <img class="icon" src="../assets/icones/edit.svg">
                                        </button>
                                        <button class="delete register">
                                            <img class="icon" src="../assets/icones/delete.svg">
                                        </button>
                                    </td>
                                </tr>
                                <!--Meh-->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
        <aside>
            <img src="../assets/mini_logo.svg" class="minilogo" alt="Mini logo da Opaco" width="75px">
            <div>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1">
                    <button class="aside-button">
                        <img src="../assets/icons/home-icon.svg" alt="home_icon" width="35x">
                    </button>
                </a>
            </div>
        </aside>
    </div>

    <dialog id="edit-register">
        <button class="close" onclick="closeDialog('edit-register')"><img
                src="../assets/icones/close-button.svg"></button>
        <h1>Editar Registro</h1>
        <form action="">
            <label for="name">Nome:</label>
            <input type="text" name="name">

            <label for="email">Email:</label>
            <input type="email" name="email">

            <label for="role">Cargo:</label>
            <select name="role">
                <option value="">ESTUDANTE</option>
                <option value="">PROFESSOR</option>
                <option value="">ADMINISTRADOR</option>
            </select>

            <label for="">Senha:</label>
            <input type="password">
            <button type="submit" class="button">
                Atualizar
            </button>
        </form>
    </dialog>

    <!-- <script src="../js/util.js"></script>
    <script src="../js/crud-adimin.js"></script> -->
    <script src="../js/popup.js"></script>
</body>

</html>
