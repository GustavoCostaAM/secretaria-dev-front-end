<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/colors.css">
    <title>Opaco - Registre-se</title>
</head>

<body>
    <div class="login-content">
        <img src="/assets/opaco_logo.svg" alt="Opaco Logo" class="login-logo">
        <form action="#" class="login-form">
            <div class="form-header">
                <h2 class="form-title">Novo por aqui?</h2>
                <p class="form-subtitle">Crie uma nova conta</p>
            </div>

            <div class="input-group">
                <label class="login-label" for="nome">Nome</label>
                <div class="input-field">
                    <span class="icon"><img src="/assets/icons/face-icon.svg" alt=""></span>
                    <input type="text" id="nome" class="login-input" placeholder="Insira seu nome completo aqui">
                </div>
            </div>

            <div class="input-group">
                <label for="password" class = "login-label">Nome de Usuário</label>
                <div class="input-field">
                    <span class="icon"><img src="/assets/icons/face-icon.svg" alt=""></span>
                    <input type="text" id="username" class="login-input" placeholder="Insira seu nome de usuário aqui">
                </div>
            </div>

            <div class="input-group">
                <label class="login-label" for="email">E-mail</label>
                <div class="input-field">
                    <span class="icon"><img src="/assets/icons/email-icon.svg" alt=""></span>
                    <input type="email" id="email" class="login-input" placeholder="Insira seu e-mail">
                </div>
            </div>

            <div class="input-group">
                <label for="password" class = "login-label">Senha</label>
                <div class="input-field">
                    <span class="icon"><img src="/assets/icons/password-icon.svg" alt=""></span>
                    <input type="password" id="password" class="login-input" placeholder="Insira sua senha">
                </div>
            </div>

            <div class="form-options">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-login">Fazer login</button>
                <p>Já possui uma conta? <a href="#" class="link-highlight">Fazer login</a></p>
            </div>
        </form>
    </div>
    <div class="login-decorator">

    </div>
</body>
</html>
