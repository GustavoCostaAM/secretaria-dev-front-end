<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/crud.css">

    <title>Opaco - Area do Aluno</title>
</head>

<body>
    <div class="layout">
        <div>

        </div>
        <div id="major">
            <div>
                <img class="logo" src="../assets/opaco_logo.svg" alt="Logo da Opaco">
            </div>
            <hr>
            <main>
                <div class="content-box">
                    <h1>Bem-vindo de volta!</h1>
                    <a href="aluno-obs.html"><button class="button">Ver Observações</button></a>
                </div>
                <div class="content-box">
                    <div class="crud-header">
                        <h1>Boletim</h1>
                        <div id="search-div">
                            <form action="" method="">
                                <input type="search" id="search" placeholder="Buscar por Matéria">
                            </form>
                        </div>
                    </div>
                    <hr>
                    <br>
                    <div class="table-wrap">
                        <table class="table-boletim" id="table">
                            <thead class="table-header">
                                <th>Matrícula</th>
                                <th>Nome</th>
                                <th>Apelido</th>
                                <th>Email</th>
                                <th>Ação</th>
                            </thead>
                            <tbody id="tbody">
                                <!--CRUD's loop for-->
                                <tr class="table-register">
                                    <td>12340</td>
                                    <td>Aristeu da Silva</td>
                                    <td>Aris</td>
                                    <td>aristeu@email.com</td>
                                    <td>
                                        <button class="button observation" onclick="openDialog('obs-popup')">
                                            <img src="../assets/icones/fi-br-comment-info.svg">
                                        </button>
                                    </td>
                                </tr>
                                <!--Meh-->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
        <aside>
            <img src="../assets/mini_logo.svg" class="minilogo" alt="Mini logo da Opaco" width="75px">
            <div>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1">
                    <button class="aside-button">
                        <img src="../assets/icons/home-icon.svg" alt="home_icon" width="35x">
                    </button>
                </a>
            </div>
        </aside>
    </div>

    <dialog id="obs-popup">
        <button class="close" onclick="closeDialog('obs-popup')"><img src="../assets/icones/close-button.svg"></button>
        <div class="">
            <h1 id="popup-aluno">Boletim de Aristeu da Silva</h1>
            <hr>
            <label for="n1">Nota 1: </label>
            <input type="number" name="n1" id="popup-n1">
            <label for="n2">Nota 2: </label>
            <input type="number" name="n2" id="popup-n2">
            <hr>
            <div>
                <h1>Observação</h1>
                <textarea class="comment-box" id="popup-observacao">Hellooo</textarea>
            </div>
            <button type="submit" class="button" id="edit-grades-button">
                Atualizar
            </button>
        </div>
    </dialog>
    <script src="../js/util.js"></script>
    <script src="../js/crud-teacher.js"></script>
    <script src="../js/popup.js"></script>
</body>

</html>
