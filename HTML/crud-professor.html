<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/crud.css">

    <title>Opaco - Area do Aluno</title>
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div>

        </div>
        <div id="major">
            <div>
                <img class="logo" src="../assets/opaco_logo.svg" alt="Logo da Opaco">
            </div>
            <hr>
            <main>
                <div class="content-box">
                    <h1>Bem-vindo de volta!</h1>
                    <p>Sua matéria: <strong id="teachers-subject"></strong></p>
                </div>
                <div class="content-box">
                    <div class="crud-header">
                        <h1>Boletim</h1>
                        <div id="search-div">
                            <form action="" method="">
                                <input type="search" id="search" placeholder="Buscar por Matrícula">
                            </form>
                        </div>
                    </div>
                    <hr>
                    <br>
                    <div class="table-wrap">
                        <table class="table-boletim" id="table">
                            <thead class="table-header">
                                <th>Matrícula</th>
                                <th>Nome</th>
                                <th>Apelido</th>
                                <th>Email</th>
                                <th>Ação</th>
                            </thead>
                            <tbody id="tbody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
        <aside>
            <img src="../assets/mini_logo.svg" class="minilogo" alt="Mini logo da Opaco" width="75px">
            <div>
                <a href="">
                    <button class="aside-button">
                        <img src="../assets/icons/home-icon.svg" alt="home_icon" width="35x">
                    </button>
                </a>
                <br>
                <br>
                <button class="aside-button" id="sair">
                    <img src="../assets/icones/fi-br-undo-alt.svg" alt="Sair" width="35px">
                </button>
            </div>
        </aside>
    </div>

    <dialog id="obs-popup">
        <button class="close" onclick="closeDialog('obs-popup')"><img src="../assets/icones/close-button.svg"></button>
        <div class="">
            <h1 id="popup-aluno">Boletim de ...</h1>
            <hr>
            <label for="n1">Nota 1: </label>
            <input type="number" name="n1" id="popup-n1">
            <label for="n2">Nota 2: </label>
            <input type="number" name="n2" id="popup-n2">
            <hr>
            <div>
                <h1>Observação</h1>
                <textarea class="comment-box" id="popup-observacao" placeholder="Digite aqui sua observação"></textarea>
            </div>
            <button type="submit" class="button" id="edit-grades-button">
                Atualizar
            </button>
        </div>
    </dialog>
    <script src="../js/util.js"></script>
    <script src="../js/crud-teacher.js"></script>
    <script src="../js/popup.js"></script>
</body>

</html>
