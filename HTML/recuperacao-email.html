<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/fonts.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/recuperacao.css">
    <title>Recuperação de Senha - Opaco</title>
</head>
<body>
    <!--Adicionar um header como o da landing para retornar-->
    <main>
        <img src="../assets/opaco_logo.svg" class="logo">
        <div>
            <h1>Recuperação de Senha</h1>
            <p>Para recuperar sua conta, um código será enviado ao seu email.</p>
        </div>
        <br>
        <form action="" method="">
            <div class="input-box">
                <img src="../assets/icons/email-icon.svg">
                <input type="email" placeholder="Digite seu email aqui" required id="inputEmail">
            </div>
            <br>
            <button type="submit" id="submitButton">
                <strong>Enviar Código</strong>
            </button>
        </form>
    </main>

    <script src="../js/util.js"></script>
    <script src="../js/popup.js"></script>
    <script src="../js/recuperacao.js"></script>
</body>
</html>
