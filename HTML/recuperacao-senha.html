<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../CSS/fonts.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/recuperacao.css">
    <title>Recuperação de Senha - Opaco</title>
    <script src="../js/util.js"></script>
    <script src="../js/recuperacao-preprocess.js"></script>
</head>
<body>
    <!--Adicionar um header como o da landing para retornar-->
    <main>
        <img src="../assets/opaco_logo.svg" class="logo">
        <div>
            <h1>Redefinir sua Senha</h1>
            <p>Insira abaixo sua nova senha</p>
        </div>
        <form action="" method="" id="senhas">
            <div class="input-box">
                <img src="../assets/icons/password-icon.svg">
                <input type="password" placeholder="Digite sua nova senha" required id="inputNewPassword">
            </div>
            <div class="input-box">
                <img src="../assets/icons/password-icon.svg">
                <input type="password" placeholder="Digite novamente" required id="inputConfirmPassword">
            </div>
            <button type="submit" id="submitButton">
                <strong>Enviar Código</strong>
            </button>
        </form>
    </main>

    <div id="update-popup" hidden>
        <div id="popup-message-container">
            <img src="../assets/icons/fi-br-check.svg" id="popup-icon">
            <p id="popup-message"></p>
        </div>
        <div id="progress-bar"></div>
    </div>

    <script src="../js/util.js"></script>
    <script src="../js/popup.js"></script>
    <script src="../js/recuperacao-senha.js"></script>
</body>
</html>
